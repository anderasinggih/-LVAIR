<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LVAIR Chart | Fullscreen Analysis</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0a0a'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-size='16' font-weight='900' font-family='Arial' fill='white'>L</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --bg-card: #111113; --bg-elevated: #18181b;
      --border: #27272a; --border-light: #3f3f46;
      --text: #fafafa; --text-secondary: #a1a1aa; --text-tertiary: #71717a;
      --accent: #60a5fa; --green: #10b981; --red: #ef4444;
      --font: 'Inter', system-ui, sans-serif; --mono: 'JetBrains Mono', monospace;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      border-bottom: 1px solid var(--border); background: var(--bg-card); height: 44px; flex-shrink: 0;
    }
    .topbar-title { font-weight: 800; font-size: 0.85rem; white-space: nowrap; }
    .topbar-pair { font-family: var(--mono); color: var(--accent); font-weight: 700; font-size: 0.82rem; }
    .topbar-price { font-family: var(--mono); font-weight: 800; font-size: 1rem; margin-left: 6px; }
    .topbar-change { font-family: var(--mono); font-size: 0.75rem; margin-left: 4px; }
    .topbar-spacer { flex: 1; }
    .topbar-section { display: flex; align-items: center; gap: 8px; }
    .topbar-label { font-size: 0.65rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; }
    .topbar-select {
      background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
      font-family: var(--mono); font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; cursor: pointer;
    }
    .topbar-select:focus { border-color: var(--accent); outline: none; }
    .topbar-close {
      background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
      font-size: 0.72rem; padding: 4px 10px; border-radius: 4px; cursor: pointer;
      font-family: var(--font); font-weight: 600; display: flex; align-items: center; gap: 4px;
    }
    .topbar-close:hover { border-color: var(--red); color: var(--red); }

    .lvair-bar {
      display: flex; align-items: center; gap: 16px; padding: 4px 16px;
      border-bottom: 1px solid var(--border); background: var(--bg); height: 30px; flex-shrink: 0;
    }
    .lvair-bar span { font-family: var(--mono); font-size: 0.66rem; color: var(--text-secondary); }
    .lvair-bar .lbl { color: var(--text-tertiary); margin-right: 2px; }
    .lvair-bar .up { color: var(--green); }
    .lvair-bar .dn { color: var(--red); }
    .lvair-bar .sep { color: var(--border-light); }

    #tradingview_chart { width: 100%; flex: 1; min-height: 0; }

    .status-bar {
      display: flex; align-items: center; gap: 10px; padding: 3px 16px;
      border-top: 1px solid var(--border); background: var(--bg-card); height: 24px; flex-shrink: 0;
    }
    .status-bar span { font-family: var(--mono); font-size: 0.6rem; color: var(--text-tertiary); }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); display: inline-block; }

    body { display: flex; flex-direction: column; }

    .loading-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--bg); z-index: 10; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="topbar-title">LVAIR</span>
    <span class="topbar-pair">LVAIR / USDT</span>
    <span class="topbar-price" id="tb-price">$0.0000</span>
    <span class="topbar-change" id="tb-change">0.00%</span>
    <span class="topbar-spacer"></span>
    <div class="topbar-section">
      <span class="topbar-label">Chart Symbol</span>
      <select class="topbar-select" id="tv-symbol-select">
        <option value="BINANCE:LVAIRUSDT" selected>LVAIR/USDT</option>
        <option value="BINANCE:BTCUSDT">BTC/USDT</option>
        <option value="BINANCE:ETHUSDT">ETH/USDT</option>
        <option value="BINANCE:SOLUSDT">SOL/USDT</option>
        <option value="BINANCE:BNBUSDT">BNB/USDT</option>
        <option value="BINANCE:XRPUSDT">XRP/USDT</option>
        <option value="BINANCE:DOGEUSDT">DOGE/USDT</option>
        <option value="BINANCE:ADAUSDT">ADA/USDT</option>
        <option value="BINANCE:AVAXUSDT">AVAX/USDT</option>
        <option value="BINANCE:DOTUSDT">DOT/USDT</option>
        <option value="BINANCE:LINKUSDT">LINK/USDT</option>
        <option value="BINANCE:MATICUSDT">MATIC/USDT</option>
        <option value="TVC:DXY">DXY (Dollar)</option>
        <option value="COMEX:GC1!">Gold Futures</option>
      </select>
    </div>
    <div class="topbar-section">
      <span class="topbar-label">Interval</span>
      <select class="topbar-select" id="tv-interval-select">
        <option value="1">1m</option>
        <option value="5">5m</option>
        <option value="15" selected>15m</option>
        <option value="30">30m</option>
        <option value="60">1H</option>
        <option value="120">2H</option>
        <option value="240">4H</option>
        <option value="D">1D</option>
        <option value="W">1W</option>
        <option value="M">1M</option>
      </select>
    </div>
    <button class="topbar-close" id="btn-close" title="Close">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      Close
    </button>
  </div>

  <div class="lvair-bar" id="lvair-bar">
    <span><span class="lbl">LVAIR</span> <span id="lv-price">$0.0000</span></span>
    <span class="sep">|</span>
    <span id="lv-change">0.00%</span>
    <span class="sep">|</span>
    <span><span class="lbl">MCap</span> <span id="lv-mcap">—</span></span>
    <span class="sep">|</span>
    <span><span class="lbl">Vol24h</span> <span id="lv-vol">—</span></span>
    <span class="sep">|</span>
    <span><span class="lbl">Supply</span> <span id="lv-supply">—</span></span>
    <span class="sep">|</span>
    <span><span class="lbl">Pool</span> <span id="lv-pool">—</span></span>
    <span style="margin-left: auto;"><span class="lbl">Oracle</span> <span id="lv-oracle">—</span></span>
  </div>

  <div style="position: relative; width: 100%; flex: 1; min-height: 0;">
    <div class="loading-overlay" id="loading-overlay">
      <div style="text-align: center;">
        <div class="loading-spinner"></div>
        <div style="margin-top: 12px; font-size: 0.75rem; color: var(--text-tertiary);">Loading TradingView Chart...</div>
      </div>
    </div>
    <div id="tradingview_chart"></div>
  </div>

  <div class="status-bar">
    <span><span class="status-dot"></span></span>
    <span id="status-text">TradingView Advanced Chart — Drawing tools, indicators, and analysis</span>
    <span style="margin-left: auto;" id="status-ts"></span>
  </div>

  <script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"></script>
  <script>
    (function() {
      const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://127.0.0.1:3001' : '';
      const params = new URLSearchParams(window.location.search);
      const initSymbol = params.get('symbol') || 'BINANCE:LVAIRUSDT';
      const initInterval = params.get('interval') || '15';

      const tvWidget = new TradingView.widget({
        container_id: 'tradingview_chart',
        autosize: true,
        symbol: initSymbol,
        interval: initInterval,
        timezone: 'Etc/UTC',
        theme: 'dark',
        style: '1',
        locale: 'en',
        backgroundColor: '#0a0a0a',
        toolbar_bg: '#111113',
        enable_publishing: false,
        allow_symbol_change: true,
        hide_side_toolbar: false,
        withdateranges: true,
        hide_volume: false,
        save_image: false,
        support_host: 'https://www.tradingview.com',
        studies: [
          'STD;Volume',
          'STD;Moving_average',
          'RSI@tv-basicstudies',
          'MACD@tv-basicstudies',
        ],
        show_popup_button: true,
        popup_width: '100%',
        popup_height: '100%',
      });

      document.getElementById('btn-close').addEventListener('click', () => window.close());

      document.getElementById('tv-symbol-select').addEventListener('change', function() {
        tvWidget.activeChart().changeSymbol(this.value);
      });
      document.getElementById('tv-interval-select').addEventListener('change', function() {
        tvWidget.activeChart().changeInterval(this.value);
      });

      tvWidget.onChartReady(() => {
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('status-ts').textContent = new Date().toLocaleTimeString();
      });

      async function refreshLvairData() {
        try {
          const [chartRes, statusRes] = await Promise.all([
            fetch(`${API}/api/chart?tf=M15`),
            fetch(`${API}/api/node/status`)
          ]);
          if (chartRes.ok) {
            const data = await chartRes.json();
            const candles = data.candles || [];
            if (candles.length) {
              const last = candles[candles.length - 1];
              document.getElementById('lv-price').textContent = '$' + last.close.toFixed(4);
              if (candles.length > 1) {
                const prev = candles[candles.length - 2].close;
                const chg = ((last.close - prev) / prev * 100);
                const el = document.getElementById('lv-change');
                el.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
                el.className = chg >= 0 ? 'up' : 'dn';
              }
              document.getElementById('lv-mcap').textContent = fmtNum(last.close * 10000000);
              const vol24 = candles.slice(-96).reduce((s, c) => s + (c.volume || 0), 0);
              document.getElementById('lv-vol').textContent = fmtNum(vol24);
            }
          }
          if (statusRes.ok) {
            const st = await statusRes.json();
            document.getElementById('lv-supply').textContent = fmtNum(st.totalSupply || 0);
            const r = st.reserves || {};
            document.getElementById('lv-pool').textContent =
              '$' + fmtNum(r.usdt || 0) + ' / ' + fmtNum(r.lvair || 0) + ' LVAIR';
          }
          const oracleRes = await fetch(`${API}/api/oracle/prices`);
          if (oracleRes.ok) {
            const o = await oracleRes.json();
            const lvair = (o.prices || []).find(p => p.symbol === 'LVAIR');
            document.getElementById('lv-oracle').textContent = '$' + ((lvair && lvair.price) || 0).toFixed(4);
          }
        } catch(e) {}
      }

      function fmtNum(n) {
        if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
        if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
        return n.toFixed(0);
      }

      refreshLvairData();
      setInterval(refreshLvairData, 5000);
    })();
  </script>
</body>
</html>
