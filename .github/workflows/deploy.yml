name: Deploy LVAIR Protocol (Monorepo) to aaPanel VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Both Applications (Web dApp & Admin Ops)
        run: npm run build

      - name: Deploy to VPS aaPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Starting LVAIR Monorepo Deploy..."
            
            # 1. Update Repository Codebase on VPS
            cd /www/wwwroot/lvair-app || git clone https://github.com/anderasinggih/-LVAIR.git /www/wwwroot/lvair-app && cd /www/wwwroot/lvair-app
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build

            # 2. Sync / Mirror Admin Ops Web into dedicated subdomain if directory exists
            if [ -d "/www/wwwroot/lvair-admin" ]; then
              mkdir -p /www/wwwroot/lvair-admin/dist
              cp -r /www/wwwroot/lvair-app/dist/* /www/wwwroot/lvair-admin/dist/
              echo "Synced Admin Ops Portal to /www/wwwroot/lvair-admin"
            fi

            # 3. Restart LVAIR Core Node Engine (pm2)
            cd /www/wwwroot/lvair-app
            if pm2 list | grep -qE "lvair-node|lvair"; then
              pm2 restart lvair-node --update-env 2>/dev/null || pm2 restart lvair --update-env
            else
              pm2 restart all
            fi

            echo "LVAIR Protocol Monorepo successfully deployed!"
