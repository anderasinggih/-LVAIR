name: Deploy LVAIR Protocol to aaPanel VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Website
        run: npm run build

      - name: Deploy to VPS aaPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 1. Masuk ke direktori web di aaPanel
            cd /www/wwwroot/lvair-app || git clone https://github.com/anderasinggih/-LVAIR.git /www/wwwroot/lvair-app && cd /www/wwwroot/lvair-app
            
            # 2. Tarik update terbaru
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Install dan build langsung di server
            npm install
            npm run build
            
            echo "LVAIR Protocol successfully deployed to aaPanel VPS!"
