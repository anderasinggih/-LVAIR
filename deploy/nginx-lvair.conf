# LVAIR Protocol — Nginx Reverse Proxy + SSL
# Deploy via: aaPanel > Website > www.lvair.my.id > Config > Paste ini
# Atau: /www/server/panel/vhost/nginx/www.lvair.my.id.conf

server {
    listen 80;
    server_name www.lvair.my.id lvair.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.lvair.my.id lvair.my.id;

    # SSL — managed by aaPanel Let's Encrypt
    ssl_certificate    /www/server/panel/vhost/cert/www.lvair.my.id/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.lvair.my.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Reverse proxy to LVAIR node
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (P2P / live chart)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Cache static assets
    location /assets/ {
        proxy_pass http://127.0.0.1:3001/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Deny sensitive endpoints from external (optional extra layer)
    location ~ ^/api/(config/airdrop|bot/|mine|liquidity/) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Only allow from internal/ops
        # Uncomment below to IP-restrict:
        # allow 127.0.0.1;
        # deny all;
    }
}
